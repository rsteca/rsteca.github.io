        <script>
            (function () {
                window._particlesRunning = true;
                var canvas = document.getElementById("particles");
                var ctx = canvas.getContext("2d");
                var width, height, dpr;
                var particles = [];
                var mouse = { x: null, y: null, down: false };

                function resize() {
                    dpr = window.devicePixelRatio || 1;
                    width = window.innerWidth;
                    height = window.innerHeight;
                    canvas.width = width * dpr;
                    canvas.height = height * dpr;
                    ctx.scale(dpr, dpr);
                    initParticles();
                }

                function initParticles() {
                    var count = Math.min(
                        Math.floor((width * height) / 8000),
                        150,
                    );
                    // Keep existing particles if we have some, just adjust count
                    while (particles.length > count) particles.pop();
                    while (particles.length < count) {
                        particles.push({
                            x: Math.random() * width,
                            y: Math.random() * height,
                            vx: (Math.random() - 0.5) * 0.8,
                            vy: (Math.random() - 0.5) * 0.8,
                            r: Math.random() * 1.5 + 1,
                        });
                    }
                }

                function animate() {
                    if (!window._particlesRunning) return;
                    ctx.clearRect(0, 0, width, height);

                    var mouseRadius = 120;
                    var mouseRadiusSq = mouseRadius * mouseRadius;

                    for (var i = 0; i < particles.length; i++) {
                        var p = particles[i];

                        // Mouse interaction
                        if (mouse.x !== null) {
                            var mdx = p.x - mouse.x;
                            var mdy = p.y - mouse.y;
                            var mdistSq = mdx * mdx + mdy * mdy;
                            if (mdistSq < mouseRadiusSq && mdistSq > 0) {
                                var mdist = Math.sqrt(mdistSq);
                                var force = (mouseRadius - mdist) / mouseRadius;
                                var dir = mouse.down ? -1 : 1; // attract on click, repel otherwise
                                p.vx += (mdx / mdist) * force * 2 * dir;
                                p.vy += (mdy / mdist) * force * 2 * dir;
                            }
                        }

                        // Dampen
                        p.vx *= 0.98;
                        p.vy *= 0.98;

                        // Move
                        p.x += p.vx;
                        p.y += p.vy;

                        // Wrap edges
                        if (p.x < 0) p.x += width;
                        if (p.x > width) p.x -= width;
                        if (p.y < 0) p.y += height;
                        if (p.y > height) p.y -= height;

                        // Draw particle
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.fillStyle = "rgba(0, 229, 255, 0.8)";
                        ctx.fill();
                    }

                    // Draw connecting lines
                    var maxDist = 140;
                    var maxDistSq = maxDist * maxDist;

                    for (var i = 0; i < particles.length; i++) {
                        for (var j = i + 1; j < particles.length; j++) {
                            var dx = particles[i].x - particles[j].x;
                            var dy = particles[i].y - particles[j].y;
                            var distSq = dx * dx + dy * dy;

                            if (distSq < maxDistSq) {
                                var opacity =
                                    (1 - Math.sqrt(distSq) / maxDist) * 0.25;
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.strokeStyle =
                                    "rgba(0, 229, 255, " + opacity + ")";
                                ctx.lineWidth = 0.5;
                                ctx.stroke();
                            }
                        }
                    }

                    requestAnimationFrame(animate);
                }

                // Mouse events
                window.addEventListener("mousemove", function (e) {
                    mouse.x = e.clientX;
                    mouse.y = e.clientY;
                });
                window.addEventListener("mouseout", function () {
                    mouse.x = null;
                    mouse.y = null;
                });
                window.addEventListener("mousedown", function () {
                    mouse.down = true;
                });
                window.addEventListener("mouseup", function () {
                    mouse.down = false;
                });

                // Touch events
                window.addEventListener(
                    "touchmove",
                    function (e) {
                        mouse.x = e.touches[0].clientX;
                        mouse.y = e.touches[0].clientY;
                    },
                    { passive: true },
                );
                window.addEventListener("touchend", function () {
                    mouse.x = null;
                    mouse.y = null;
                });

                // Resize with debounce
                var resizeTimer;
                window.addEventListener("resize", function () {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(function () {
                        ctx.setTransform(1, 0, 0, 1, 0, 0); // reset scale before re-applying
                        resize();
                    }, 200);
                });

                window._restartParticles = function () {
                    ctx.setTransform(1, 0, 0, 1, 0, 0);
                    resize();
                    animate();
                };

                resize();
                animate();
            })();
        </script>

        <script>
            (function () {
                // === GAME CONSTANTS ===
                var STATES = { TITLE: 0, PLAYING: 1, DEAD: 2, WIN: 3 };
                var GRAVITY = 1800;
                var JUMP_VEL = -520;
                var JUMP_HOLD_FORCE = -1200;
                var JUMP_HOLD_MAX = 0.18;
                var MOVE_ACCEL = 2000;
                var MOVE_DECEL = 1600;
                var MAX_VX = 250;
                var MAX_VY = 800;
                var GW = 800;
                var GH = 450;

                var C = {
                    bg: "#0a0a0f",
                    bgLight: "#12121a",
                    plat: "#1a1a2e",
                    platTop: "#00e5ff",
                    player: "#00e5ff",
                    playerDark: "#0099aa",
                    enemy: "#ff4444",
                    enemyDark: "#aa2222",
                    coin: "#ffdd44",
                    coinDark: "#cc9900",
                    flag: "#00ff88",
                    pole: "#666666",
                    text: "#e0e0e0",
                    accent: "#00e5ff",
                    uiBg: "rgba(10, 10, 15, 0.8)",
                };

                // === GAME STATE ===
                var g = {
                    state: null,
                    canvas: null,
                    ctx: null,
                    scale: 1,
                    offX: 0,
                    offY: 0,
                    camX: 0,
                    last: 0,
                    raf: null,
                    score: 0,
                    timer: 0,
                };

                var pl = {
                    x: 0,
                    y: 0,
                    w: 20,
                    h: 28,
                    vx: 0,
                    vy: 0,
                    ground: false,
                    jumpHeld: false,
                    jumpTimer: 0,
                    facing: 1,
                    frame: 0,
                    ft: 0,
                    alive: true,
                };

                var keys = {};
                var touch = { left: false, right: false, jump: false };
                var isTouchDevice = false;

                // === LEVEL DATA ===
                var platforms = [];
                var enemies = [];
                var coins = [];
                var flag = { x: 0, y: 0, w: 0, h: 0 };
                var spawn = { x: 50, y: 340 };
                var levelW = 3200;
                var totalCoins = 0;

                function buildLevel() {
                    platforms = [];
                    enemies = [];
                    coins = [];

                    // Ground segments (y=400, h=50)
                    addGround(0, 620);
                    addGround(700, 420);
                    addGround(1200, 520);
                    addGround(1900, 300);
                    addGround(2400, 800);

                    // Floating platforms
                    addPlat(280, 320, 110);
                    addPlat(480, 260, 90);
                    addPlat(650, 200, 80);
                    addPlat(760, 310, 120);
                    addPlat(1000, 250, 100);
                    addPlat(1160, 180, 80);
                    addPlat(1400, 290, 100);
                    addPlat(1600, 230, 120);
                    addPlat(1760, 320, 80);
                    addPlat(2100, 270, 100);
                    addPlat(2250, 190, 120);
                    addPlat(2700, 290, 100);
                    addPlat(2900, 230, 80);

                    // Enemies
                    addEnemy(180, 400, 100, 280);
                    addEnemy(850, 400, 760, 960);
                    addEnemy(1350, 400, 1260, 1460);
                    addEnemy(1640, 230, 1600, 1720);
                    addEnemy(2550, 400, 2460, 2660);
                    addEnemy(2800, 400, 2700, 2900);

                    // Coins — arcs over gaps, on platforms, clusters
                    // Over first gap
                    addCoin(630, 340);
                    addCoin(650, 315);
                    addCoin(670, 305);
                    addCoin(690, 315);
                    // On floating platforms
                    addCoin(325, 290);
                    addCoin(515, 230);
                    addCoin(680, 170);
                    addCoin(1040, 220);
                    addCoin(1190, 150);
                    // Mid-section line
                    addCoin(1250, 375);
                    addCoin(1280, 375);
                    addCoin(1310, 375);
                    addCoin(1340, 375);
                    addCoin(1370, 375);
                    // Near flag
                    addCoin(2950, 200);
                    addCoin(3000, 200);
                    addCoin(3050, 200);

                    totalCoins = coins.length;

                    flag = { x: 3100, y: 310, w: 10, h: 90 };
                    spawn = { x: 50, y: 340 };
                }

                function addGround(x, w) {
                    platforms.push({ x: x, y: 400, w: w, h: 50 });
                }

                function addPlat(x, y, w) {
                    platforms.push({ x: x, y: y, w: w, h: 14 });
                }

                function addEnemy(x, y, minX, maxX) {
                    enemies.push({
                        x: x,
                        y: y - 20,
                        w: 20,
                        h: 20,
                        vx: 60,
                        minX: minX,
                        maxX: maxX,
                        alive: true,
                        frame: 0,
                        ft: 0,
                    });
                }

                function addCoin(x, y) {
                    coins.push({
                        x: x,
                        y: y,
                        w: 14,
                        h: 14,
                        got: false,
                        frame: 0,
                        ft: 0,
                    });
                }

                // === COLLISION ===
                function overlap(a, b) {
                    return (
                        a.x < b.x + b.w &&
                        a.x + a.w > b.x &&
                        a.y < b.y + b.h &&
                        a.y + a.h > b.y
                    );
                }

                function resolveCollisions() {
                    pl.ground = false;
                    for (var i = 0; i < platforms.length; i++) {
                        var p = platforms[i];
                        if (!overlap(pl, p)) continue;

                        var oL = pl.x + pl.w - p.x;
                        var oR = p.x + p.w - pl.x;
                        var oT = pl.y + pl.h - p.y;
                        var oB = p.y + p.h - pl.y;
                        var min = Math.min(oL, oR, oT, oB);

                        if (min === oT && pl.vy >= 0) {
                            pl.y = p.y - pl.h;
                            pl.vy = 0;
                            pl.ground = true;
                        } else if (min === oB && pl.vy < 0) {
                            pl.y = p.y + p.h;
                            pl.vy = 0;
                        } else if (min === oL) {
                            pl.x = p.x - pl.w;
                            pl.vx = 0;
                        } else if (min === oR) {
                            pl.x = p.x + p.w;
                            pl.vx = 0;
                        }
                    }
                }

                // === INPUT ===
                function isLeft() {
                    return keys.ArrowLeft || keys.KeyA || touch.left;
                }
                function isRight() {
                    return keys.ArrowRight || keys.KeyD || touch.right;
                }
                function isJump() {
                    return (
                        keys.ArrowUp || keys.KeyW || keys.Space || touch.jump
                    );
                }

                function onKeyDown(e) {
                    keys[e.code] = true;
                    if (
                        [
                            "ArrowUp",
                            "ArrowDown",
                            "ArrowLeft",
                            "ArrowRight",
                            "Space",
                        ].indexOf(e.code) !== -1
                    ) {
                        e.preventDefault();
                    }
                    handleStateKey(e.code);
                }

                function onKeyUp(e) {
                    keys[e.code] = false;
                }

                function handleStateKey(code) {
                    if (code === "Escape") {
                        stopGame();
                        return;
                    }
                    if (code === "Enter" || code === "Space") {
                        if (g.state === STATES.TITLE) {
                            g.state = STATES.PLAYING;
                            resetPlayer();
                        } else if (g.state === STATES.DEAD && g.timer <= 0) {
                            g.state = STATES.PLAYING;
                            g.score = 0;
                            buildLevel();
                            resetPlayer();
                        } else if (g.state === STATES.WIN && g.timer <= 0) {
                            g.state = STATES.PLAYING;
                            g.score = 0;
                            buildLevel();
                            resetPlayer();
                        }
                    }
                }

                function onTouchStart(e) {
                    isTouchDevice = true;
                    e.preventDefault();
                    updateTouches(e.touches);
                    if (g.state === STATES.TITLE) {
                        g.state = STATES.PLAYING;
                        resetPlayer();
                    } else if (g.state === STATES.DEAD && g.timer <= 0) {
                        g.state = STATES.PLAYING;
                        g.score = 0;
                        buildLevel();
                        resetPlayer();
                    } else if (g.state === STATES.WIN && g.timer <= 0) {
                        g.state = STATES.PLAYING;
                        g.score = 0;
                        buildLevel();
                        resetPlayer();
                    }
                }

                function onTouchMove(e) {
                    e.preventDefault();
                    updateTouches(e.touches);
                }

                function onTouchEnd(e) {
                    e.preventDefault();
                    updateTouches(e.touches);
                }

                function updateTouches(touches) {
                    touch.left = false;
                    touch.right = false;
                    touch.jump = false;
                    for (var i = 0; i < touches.length; i++) {
                        var t = touches[i];
                        var x = (t.clientX - g.offX) / g.scale;
                        var y = (t.clientY - g.offY) / g.scale;
                        if (y > GH - 100) {
                            if (x < GW * 0.25) touch.left = true;
                            else if (x < GW * 0.5) touch.right = true;
                            else touch.jump = true;
                        } else {
                            // Upper screen tap = jump
                            if (x > GW * 0.5) touch.jump = true;
                            else touch.right = true;
                        }
                    }
                }

                // === UPDATE ===
                function updatePlayer(dt) {
                    var ix = 0;
                    if (isLeft()) ix = -1;
                    if (isRight()) ix = 1;

                    if (ix !== 0) {
                        pl.vx += ix * MOVE_ACCEL * dt;
                        pl.facing = ix;
                    } else {
                        if (pl.vx > 0)
                            pl.vx = Math.max(0, pl.vx - MOVE_DECEL * dt);
                        else pl.vx = Math.min(0, pl.vx + MOVE_DECEL * dt);
                    }
                    pl.vx = Math.max(-MAX_VX, Math.min(MAX_VX, pl.vx));

                    var jp = isJump();
                    if (jp && pl.ground && !pl.jumpHeld) {
                        pl.vy = JUMP_VEL;
                        pl.ground = false;
                        pl.jumpTimer = 0;
                        pl.jumpHeld = true;
                    }
                    if (jp && pl.jumpHeld && pl.jumpTimer < JUMP_HOLD_MAX) {
                        pl.vy += JUMP_HOLD_FORCE * dt;
                        pl.jumpTimer += dt;
                    }
                    if (!jp) pl.jumpHeld = false;

                    pl.vy += GRAVITY * dt;
                    pl.vy = Math.min(MAX_VY, pl.vy);

                    pl.x += pl.vx * dt;
                    pl.y += pl.vy * dt;

                    // Clamp to level bounds
                    if (pl.x < 0) {
                        pl.x = 0;
                        pl.vx = 0;
                    }
                    if (pl.x + pl.w > levelW) {
                        pl.x = levelW - pl.w;
                        pl.vx = 0;
                    }

                    resolveCollisions();

                    // Walk animation
                    if (pl.ground && Math.abs(pl.vx) > 10) {
                        pl.ft += dt;
                        if (pl.ft > 0.1) {
                            pl.frame++;
                            pl.ft = 0;
                        }
                    } else {
                        pl.frame = 0;
                        pl.ft = 0;
                    }

                    // Fall death
                    if (pl.y > GH + 50) killPlayer();
                }

                function updateEnemies(dt) {
                    for (var i = 0; i < enemies.length; i++) {
                        var e = enemies[i];
                        if (!e.alive) continue;

                        e.x += e.vx * dt;
                        if (e.x <= e.minX || e.x + e.w >= e.maxX) e.vx = -e.vx;

                        e.ft += dt;
                        if (e.ft > 0.2) {
                            e.frame = (e.frame + 1) % 2;
                            e.ft = 0;
                        }

                        if (pl.alive && overlap(pl, e)) {
                            if (pl.vy > 0 && pl.y + pl.h < e.y + e.h * 0.65) {
                                e.alive = false;
                                pl.vy = JUMP_VEL * 0.6;
                                g.score += 100;
                            } else {
                                killPlayer();
                            }
                        }
                    }
                }

                function updateCoins(dt) {
                    for (var i = 0; i < coins.length; i++) {
                        var c = coins[i];
                        if (c.got) continue;
                        c.ft += dt;
                        if (c.ft > 0.08) {
                            c.frame = (c.frame + 1) % 8;
                            c.ft = 0;
                        }
                        if (overlap(pl, c)) {
                            c.got = true;
                            g.score += 50;
                        }
                    }
                }

                function updateCamera() {
                    var target = pl.x - GW * 0.35;
                    g.camX += (target - g.camX) * 0.1;
                    g.camX = Math.max(0, Math.min(levelW - GW, g.camX));
                }

                function killPlayer() {
                    pl.alive = false;
                    g.state = STATES.DEAD;
                    g.timer = 1.5;
                }

                function checkWin() {
                    if (overlap(pl, flag)) {
                        g.state = STATES.WIN;
                        g.timer = 1.5;
                    }
                }

                function resetPlayer() {
                    pl.x = spawn.x;
                    pl.y = spawn.y;
                    pl.vx = 0;
                    pl.vy = 0;
                    pl.ground = false;
                    pl.jumpHeld = false;
                    pl.jumpTimer = 0;
                    pl.alive = true;
                    pl.frame = 0;
                    pl.ft = 0;
                    pl.facing = 1;
                    g.camX = 0;
                }

                // === RENDERING ===
                function drawBg(ctx) {
                    ctx.fillStyle = C.bg;
                    ctx.fillRect(0, 0, GW, GH);

                    // Parallax city silhouette
                    var px = g.camX * 0.1;
                    ctx.fillStyle = C.bgLight;
                    for (var i = 0; i < 25; i++) {
                        var bx = i * 160 - (px % 160);
                        var bh = 30 + ((i * 7 + 3) % 40);
                        ctx.fillRect(bx, GH - 60 - bh, 50, bh);
                        ctx.fillRect(bx + 70, GH - 60 - bh * 0.5, 35, bh * 0.5);
                    }

                    // Stars
                    ctx.fillStyle = "rgba(0, 229, 255, 0.12)";
                    var sp = px * 0.02;
                    for (var i = 0; i < 50; i++) {
                        var sx = ((i * 137 + 50) % GW) - (sp % GW);
                        if (sx < 0) sx += GW;
                        var sy = (i * 89 + 20) % (GH * 0.45);
                        ctx.fillRect(sx, sy, 2, 2);
                    }
                }

                function drawPlatforms(ctx) {
                    for (var i = 0; i < platforms.length; i++) {
                        var p = platforms[i];
                        var sx = Math.round(p.x - g.camX);
                        if (sx + p.w < 0 || sx > GW) continue;
                        ctx.fillStyle = C.plat;
                        ctx.fillRect(sx, p.y, p.w, p.h);
                        ctx.fillStyle = C.platTop;
                        ctx.fillRect(sx, p.y, p.w, 2);
                    }
                }

                function drawPlayer(ctx) {
                    if (!pl.alive) return;
                    var px = Math.round(pl.x - g.camX);
                    var py = Math.round(pl.y);

                    ctx.save();
                    if (pl.facing === -1) {
                        ctx.translate(px + pl.w, py);
                        ctx.scale(-1, 1);
                        px = 0;
                        py = 0;
                    }

                    // Head
                    ctx.fillStyle = C.player;
                    ctx.fillRect(px + 5, py, 10, 10);
                    // Eye
                    ctx.fillStyle = C.bg;
                    ctx.fillRect(px + 12, py + 3, 3, 3);
                    // Body
                    ctx.fillStyle = C.player;
                    ctx.fillRect(px + 4, py + 10, 12, 10);
                    // Legs
                    ctx.fillStyle = C.playerDark;
                    if (pl.ground && Math.abs(pl.vx) > 10) {
                        var s = pl.frame % 2;
                        ctx.fillRect(px + 4 + s * 4, py + 20, 4, 8);
                        ctx.fillRect(px + 12 - s * 4, py + 20, 4, 8);
                    } else if (!pl.ground) {
                        // Airborne: legs tucked
                        ctx.fillRect(px + 4, py + 20, 5, 6);
                        ctx.fillRect(px + 11, py + 20, 5, 6);
                    } else {
                        ctx.fillRect(px + 5, py + 20, 4, 8);
                        ctx.fillRect(px + 11, py + 20, 4, 8);
                    }
                    ctx.restore();
                }

                function drawEnemies(ctx) {
                    for (var i = 0; i < enemies.length; i++) {
                        var e = enemies[i];
                        if (!e.alive) continue;
                        var sx = Math.round(e.x - g.camX);
                        if (sx + e.w < 0 || sx > GW) continue;

                        ctx.fillStyle = C.enemy;
                        ctx.fillRect(sx, e.y, e.w, e.h);
                        // Eyes
                        ctx.fillStyle = "#fff";
                        ctx.fillRect(sx + 3, e.y + 5, 4, 4);
                        ctx.fillRect(sx + 13, e.y + 5, 4, 4);
                        // Pupils
                        ctx.fillStyle = C.bg;
                        ctx.fillRect(sx + 5, e.y + 6, 2, 2);
                        ctx.fillRect(sx + 15, e.y + 6, 2, 2);
                        // Feet
                        ctx.fillStyle = C.enemyDark;
                        var s = e.frame % 2;
                        ctx.fillRect(sx + 2 + s * 2, e.y + e.h, 6, 3);
                        ctx.fillRect(sx + 12 - s * 2, e.y + e.h, 6, 3);
                    }
                }

                function drawCoins(ctx) {
                    for (var i = 0; i < coins.length; i++) {
                        var c = coins[i];
                        if (c.got) continue;
                        var sx = Math.round(c.x - g.camX);
                        if (sx + c.w < 0 || sx > GW) continue;

                        var spin = Math.abs(Math.sin((c.frame * Math.PI) / 4));
                        var dw = Math.max(2, Math.round(c.w * spin));
                        var off = Math.round((c.w - dw) / 2);
                        ctx.fillStyle = C.coin;
                        ctx.fillRect(sx + off, c.y, dw, c.h);
                        if (dw > 3) {
                            ctx.fillStyle = C.coinDark;
                            ctx.fillRect(sx + off + 1, c.y + 3, dw - 2, 2);
                        }
                    }
                }

                function drawFlag(ctx) {
                    var sx = Math.round(flag.x - g.camX);
                    if (sx + 40 < 0 || sx > GW) return;

                    ctx.fillStyle = C.pole;
                    ctx.fillRect(sx, flag.y, flag.w, flag.h);
                    // Ball on top
                    ctx.fillStyle = C.flag;
                    ctx.fillRect(sx - 2, flag.y - 6, 14, 6);
                    // Banner
                    ctx.fillStyle = C.flag;
                    ctx.fillRect(sx + flag.w, flag.y, 28, 18);
                    // Star
                    ctx.fillStyle = "#fff";
                    ctx.fillRect(sx + flag.w + 10, flag.y + 5, 6, 6);
                }

                function drawHUD(ctx) {
                    ctx.fillStyle = C.uiBg;
                    ctx.fillRect(0, 0, GW, 32);

                    ctx.font = "bold 14px monospace";
                    ctx.textAlign = "left";
                    ctx.fillStyle = C.accent;
                    ctx.fillText("SCORE: " + g.score, 12, 22);

                    var got = 0;
                    for (var i = 0; i < coins.length; i++)
                        if (coins[i].got) got++;
                    ctx.fillStyle = C.coin;
                    ctx.fillText("COINS: " + got + "/" + totalCoins, 180, 22);

                    ctx.fillStyle = "rgba(224, 224, 224, 0.35)";
                    ctx.textAlign = "right";
                    ctx.font = "12px monospace";
                    ctx.fillText("ESC to quit", GW - 12, 22);
                }

                function drawTouchControls(ctx) {
                    ctx.globalAlpha = 0.15;
                    var bh = 55;
                    var by = GH - bh - 10;

                    ctx.fillStyle = C.accent;
                    ctx.fillRect(10, by, 70, bh);
                    ctx.fillRect(90, by, 70, bh);
                    ctx.fillRect(GW - 80, by, 70, bh);

                    ctx.globalAlpha = 0.4;
                    ctx.fillStyle = "#fff";
                    ctx.font = "bold 22px monospace";
                    ctx.textAlign = "center";
                    ctx.fillText("\u25C0", 45, by + 35);
                    ctx.fillText("\u25B6", 125, by + 35);
                    ctx.fillText("\u25B2", GW - 45, by + 35);
                    ctx.globalAlpha = 1;
                }

                // === SCREENS ===
                function drawTitle(ctx) {
                    ctx.fillStyle = C.bg;
                    ctx.fillRect(0, 0, GW, GH);

                    ctx.textAlign = "center";

                    ctx.fillStyle = C.accent;
                    ctx.font = "bold 38px monospace";
                    ctx.fillText("CYBER RUNNER", GW / 2, 140);

                    ctx.fillStyle = C.text;
                    ctx.font = "15px monospace";
                    ctx.fillText("Arrow keys / WASD to move", GW / 2, 210);
                    ctx.fillText("Up / W / Space to jump", GW / 2, 235);
                    ctx.fillText(
                        "Stomp enemies, collect coins, reach the flag!",
                        GW / 2,
                        275,
                    );

                    if (Math.floor(Date.now() / 500) % 2) {
                        ctx.fillStyle = C.accent;
                        ctx.font = "bold 16px monospace";
                        if (isTouchDevice) {
                            ctx.fillText("Tap to start", GW / 2, 340);
                        } else {
                            ctx.fillText("Press ENTER to start", GW / 2, 340);
                        }
                    }

                    ctx.fillStyle = "rgba(224, 224, 224, 0.3)";
                    ctx.font = "12px monospace";
                    ctx.fillText("ESC to return to site", GW / 2, 420);

                    // Draw little player preview
                    ctx.fillStyle = C.player;
                    ctx.fillRect(GW / 2 - 10 + 5, 50, 10, 10);
                    ctx.fillRect(GW / 2 - 10 + 4, 60, 12, 10);
                    ctx.fillStyle = C.playerDark;
                    ctx.fillRect(GW / 2 - 10 + 5, 70, 4, 8);
                    ctx.fillRect(GW / 2 - 10 + 11, 70, 4, 8);
                    ctx.fillStyle = C.bg;
                    ctx.fillRect(GW / 2 - 10 + 12, 53, 3, 3);
                }

                function drawDeath(ctx) {
                    drawBg(ctx);
                    drawPlatforms(ctx);
                    drawCoins(ctx);
                    drawEnemies(ctx);
                    drawFlag(ctx);

                    ctx.fillStyle = "rgba(10, 10, 15, 0.75)";
                    ctx.fillRect(0, 0, GW, GH);

                    ctx.textAlign = "center";
                    ctx.fillStyle = C.enemy;
                    ctx.font = "bold 34px monospace";
                    ctx.fillText("GAME OVER", GW / 2, 190);

                    ctx.fillStyle = C.text;
                    ctx.font = "16px monospace";
                    ctx.fillText("Score: " + g.score, GW / 2, 240);

                    if (g.timer <= 0) {
                        if (Math.floor(Date.now() / 500) % 2) {
                            ctx.fillStyle = C.accent;
                            ctx.font = "bold 15px monospace";
                            if (isTouchDevice) {
                                ctx.fillText("Tap to retry", GW / 2, 300);
                            } else {
                                ctx.fillText(
                                    "Press ENTER to retry",
                                    GW / 2,
                                    300,
                                );
                            }
                        }
                    }
                }

                function drawWin(ctx) {
                    drawBg(ctx);
                    drawPlatforms(ctx);
                    drawFlag(ctx);

                    ctx.fillStyle = "rgba(10, 10, 15, 0.75)";
                    ctx.fillRect(0, 0, GW, GH);

                    ctx.textAlign = "center";
                    ctx.fillStyle = C.flag;
                    ctx.font = "bold 34px monospace";
                    ctx.fillText("LEVEL COMPLETE!", GW / 2, 170);

                    ctx.fillStyle = C.coin;
                    ctx.font = "20px monospace";
                    ctx.fillText("Score: " + g.score, GW / 2, 220);
                    var got = 0;
                    for (var i = 0; i < coins.length; i++)
                        if (coins[i].got) got++;
                    ctx.fillText(
                        "Coins: " + got + "/" + totalCoins,
                        GW / 2,
                        250,
                    );

                    if (g.timer <= 0) {
                        ctx.fillStyle = C.text;
                        ctx.font = "15px monospace";
                        if (isTouchDevice) {
                            ctx.fillText("Tap to play again", GW / 2, 310);
                        } else {
                            ctx.fillText(
                                "Press ENTER to play again",
                                GW / 2,
                                310,
                            );
                        }
                        ctx.fillText("ESC to return to site", GW / 2, 340);
                    }
                }

                // === GAME LOOP ===
                function gameLoop(ts) {
                    if (g.state === null) return;

                    var dt = Math.min((ts - g.last) / 1000, 0.05);
                    g.last = ts;
                    var ctx = g.ctx;

                    switch (g.state) {
                        case STATES.TITLE:
                            drawTitle(ctx);
                            break;
                        case STATES.PLAYING:
                            updatePlayer(dt);
                            updateEnemies(dt);
                            updateCoins(dt);
                            checkWin();
                            updateCamera();
                            drawBg(ctx);
                            drawPlatforms(ctx);
                            drawCoins(ctx);
                            drawEnemies(ctx);
                            drawPlayer(ctx);
                            drawFlag(ctx);
                            drawHUD(ctx);
                            if (isTouchDevice) drawTouchControls(ctx);
                            break;
                        case STATES.DEAD:
                            g.timer -= dt;
                            drawDeath(ctx);
                            break;
                        case STATES.WIN:
                            g.timer -= dt;
                            drawWin(ctx);
                            break;
                    }

                    g.raf = requestAnimationFrame(gameLoop);
                }

                // === START / STOP ===
                function resizeGame() {
                    var canvas = g.canvas;
                    var vw = window.innerWidth;
                    var vh = window.innerHeight;
                    var sx = vw / GW;
                    var sy = vh / GH;
                    g.scale = Math.min(sx, sy);
                    g.offX = (vw - GW * g.scale) / 2;
                    g.offY = (vh - GH * g.scale) / 2;
                    var dpr = window.devicePixelRatio || 1;
                    canvas.width = vw * dpr;
                    canvas.height = vh * dpr;
                    g.ctx.setTransform(
                        g.scale * dpr,
                        0,
                        0,
                        g.scale * dpr,
                        g.offX * dpr,
                        g.offY * dpr,
                    );
                }

                var gameResizeHandler = null;

                function startGame() {
                    window._particlesRunning = false;
                    document.querySelector(".content").style.display = "none";

                    var canvas = document.getElementById("particles");
                    g.canvas = canvas;
                    g.ctx = canvas.getContext("2d");
                    g.ctx.setTransform(1, 0, 0, 1, 0, 0);

                    resizeGame();
                    buildLevel();
                    resetPlayer();

                    g.state = STATES.TITLE;
                    g.score = 0;
                    g.last = performance.now();
                    keys = {};
                    touch = { left: false, right: false, jump: false };

                    document.addEventListener("keydown", onKeyDown);
                    document.addEventListener("keyup", onKeyUp);
                    canvas.addEventListener("touchstart", onTouchStart, {
                        passive: false,
                    });
                    canvas.addEventListener("touchmove", onTouchMove, {
                        passive: false,
                    });
                    canvas.addEventListener("touchend", onTouchEnd, {
                        passive: false,
                    });

                    gameResizeHandler = function () {
                        resizeGame();
                    };
                    window.addEventListener("resize", gameResizeHandler);

                    g.raf = requestAnimationFrame(gameLoop);
                }

                function stopGame() {
                    if (g.raf) cancelAnimationFrame(g.raf);
                    g.state = null;

                    document.removeEventListener("keydown", onKeyDown);
                    document.removeEventListener("keyup", onKeyUp);
                    g.canvas.removeEventListener("touchstart", onTouchStart);
                    g.canvas.removeEventListener("touchmove", onTouchMove);
                    g.canvas.removeEventListener("touchend", onTouchEnd);
                    if (gameResizeHandler) {
                        window.removeEventListener("resize", gameResizeHandler);
                        gameResizeHandler = null;
                    }

                    keys = {};
                    touch = { left: false, right: false, jump: false };

                    document.querySelector(".content").style.display = "";

                    window._particlesRunning = true;
                    window._restartParticles();
                }

                // === AVATAR TRIGGER ===
                var avatar = document.querySelector(".avatar");
                avatar.style.cursor = "pointer";
                avatar.addEventListener("click", function (e) {
                    e.preventDefault();
                    startGame();
                });
            })();
        </script>
    </body>
</html>
